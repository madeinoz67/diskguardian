[package]
name = "diskguardian-core"
description = "Cross-platform disk space scanning engine: physical-size accounting, tree building, collection and guarded deletion"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
rayon.workspace = true
trash.workspace = true
blake3 = "1"

[dev-dependencies]
serde_json.workspace = true
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# `all` only. Pedantic was enabled first and produced seven style lints (doc_markdown and
# friends) that cost more to appease than they teach; CI gates on warnings, so the rule set
# has to be one the project actually believes.
all = { level = "warn", priority = -1 }
