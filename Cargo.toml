[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/admin",
    "crates/win-elevate",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/madeinoz67/diskguardian"
rust-version = "1.82"
authors = ["Stephen Eaton"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rayon = "1.10"
trash = "5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# A debug build of a tree walker is unusably slow: the traversal is the product. Keep
# debuggability for our own crates but optimise them and the dependency tree.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
