name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Scan engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The engine is the portable half of the product, so it is proven on all three.
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/core

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -p diskguardian-core --all-targets -- -D warnings

      - name: Test
        run: cargo test -p diskguardian-core -- --nocapture

      # The lanes above prove the ENGINE on three platforms; until now nothing built the
      # application anywhere but macOS, so an app-crate platform break would have shipped
      # unnoticed and only the release tag would find it. This compiles the real crate.
      - name: Frontend toolchain
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf

      - name: Build the frontend (the app crate embeds it at compile time)
        working-directory: apps/desktop
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Stage the measurement helper for this host
        working-directory: apps/desktop
        run: bun run stage:admin

      - name: Check the application compiles here too
        # -D warnings, not merely warnings: a platform-specific import that no longer has a
        # user on that platform is exactly how this lane earns its keep, and a green lane
        # full of warnings teaches everyone to ignore it.
        env:
          RUSTFLAGS: -D warnings
        run: cargo check -p diskguardian-app

  frontend:
    name: Sunburst (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
        with:
          # The claim check compares against the base commit, so the base object has to be
          # present; a shallow clone cannot show it.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Layout tests
        run: bun test

      - name: Build
        run: bun run build

      # A prose record cannot be kept honest by intention. This is the only mechanical rule
      # the ISA admits: what this change closes must name how it was checked. It runs on the
      # claims the branch newly ticks, so the historical ticks are a backlog rather than a
      # blocker — `bun run scripts/check-isa-claims.ts ISA.md --all` audits those.
      - name: Claim record
        working-directory: ..
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          bun test scripts/
          bun run scripts/check-isa-claims.ts ISA.md --base "$BASE"
