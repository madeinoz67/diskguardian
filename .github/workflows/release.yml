name: Release

# Two lanes on purpose:
#
#   build   — runs on every dispatch and every tag, publishes nothing. It produces the
#             per-platform bundles and asserts they contain what they must, so the
#             pipeline can be proven without a public release existing.
#   release — tags only. Takes the artifacts the build lane produced and publishes them as
#             the release. Nothing here rebuilds, so what ships is what was verified, and
#             publication is asserted from the API afterwards rather than assumed.
#
# Four legs, one per target triple (multi-platform release design §3.1, amended
# 2026-11-03): macOS arm64 + x86_64, Windows x86_64 (NSIS, app binary ONLY — no
# sidecar), Linux x86_64 (deb + AppImage, sidecar ships). Each leg builds its own host
# triple — no cross-compilation — and verifies its payload against the binaries cargo
# built for that triple, by SHA-256, against that platform's expected set.
#
# Everything is unsigned (there is no signing identity): Gatekeeper, SmartScreen and
# unsigned-deb warnings are stated in the release body rather than left for the user
# to discover.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A tag is a publish, so a tag has to earn it. This runs before anything is built and
  # refuses a tag that is not a release: `tags: ['v*']` alone would happily publish a
  # `v-test` on a feature branch, and a tag that disagrees with the version in the tree
  # would ship a binary labelled something it is not. Dispatched builds carry no tag and
  # skip this entirely, which is what keeps the build lane usable for verification.
  guard:
    name: The tag is a release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: The tag is vX.Y.Z, on main, and agrees with the tree
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          echo "tag: $TAG"

          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "refusing: '$TAG' is not a vX.Y.Z release tag"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "version: $VERSION"

          # A tag on an unmerged branch would publish work main has never seen.
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "refusing: $GITHUB_SHA is not an ancestor of origin/main"
            exit 1
          fi
          echo "ancestry: $GITHUB_SHA is on main"

          # The tag IS the version users download, so it must equal every surface the
          # build stamps. A typo here publishes a binary labelled something it is not.
          cargo_version="$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml \
            | sed -n 's/^version = "\(.*\)"$/\1/p' | head -1)"
          tauri_version="$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)"
          package_version="$(jq -r .version apps/desktop/package.json)"
          echo "Cargo.toml workspace: $cargo_version"
          echo "tauri.conf.json:     $tauri_version"
          echo "package.json:        $package_version"

          for seen in "$cargo_version" "$tauri_version" "$package_version"; do
            if [ "$seen" != "$VERSION" ]; then
              echo "refusing: the tree says '$seen' but the tag says '$VERSION'"
              exit 1
            fi
          done
          echo "version surfaces agree with the tag"

  build:
    name: Bundle (${{ matrix.target }})
    needs: guard
    # A skipped `guard` means a dispatched build, which is the lane used to verify the
    # pipeline without publishing. Only a tag has to pass, so `skipped` must not propagate
    # as failure here or the dispatch lane stops working.
    if: always() && (needs.guard.result == 'success' || needs.guard.result == 'skipped')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            bundles: app,dmg
          - target: x86_64-apple-darwin
            os: macos-latest
            bundles: app,dmg
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bundles: nsis
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bundles: deb,appimage
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/desktop/src-tauri

      # The exact webview set CI already proves, plus nothing speculative
      # (design §3.2). If the AppImage step still trips over FUSE on a newer
      # ubuntu, the named remediation is `sudo apt-get install -y libfuse2t64`.
      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: bun install --frozen-lockfile

      # Tauri's externalBin needs the helper under the target triple, and
      # `beforeBuildCommand` only builds the frontend — so the helper is staged here,
      # explicitly, for the architecture being bundled. Windows ships no sidecar
      # (maintainer ruling, 2026-11-03): its bundle config has no externalBin, so there
      # is nothing to stage and the leg skips this entirely.
      - name: Stage the measurement helper
        if: runner.os != 'Windows'
        working-directory: apps/desktop
        run: bun run stage:admin --target ${{ matrix.target }}

      # APPIMAGE_EXTRACT_AND_RUN makes the bundler's linuxdeploy (itself an AppImage)
      # run without FUSE on the runner; a no-op on the other legs.
      #
      # --no-binary-patching (design Amendment 2, maintainer ruling): Tauri rewrites a
      # 3-byte bundle-type slot (__TAURI_BUNDLE_TYPE_VAR_UNK -> _DEB/_NSS/...) in the
      # main binary per format — attempt 3 proved it by byte dump — which would make the
      # deb/NSIS payloads differ from the cargo build products by construction. The flag
      # disables that rewrite; its only documented cost is per-bundle-type updater
      # support, and this app ships no updater. A no-op for the macOS-native bundles.
      - name: Build the bundle
        working-directory: apps/desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: bunx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --no-binary-patching

      # ── Verification, per platform ─────────────────────────────────────────────
      # The rule each leg enforces (design §3.3): the packaged payload contains, by
      # SHA-256 equal to the cargo build products under target/<triple>/release/,
      # every binary in that platform's expected set — and, on Windows, no binary
      # outside it. Hash equality proves presence, correctness AND architecture in one
      # check, and does not care what the bundler renamed the main binary to inside
      # each format. Every compared hash is printed: those lines are the evidence
      # Stage B checks against.

      - name: Verify the bundle contains what it must (macOS)
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          APP="$(ls -d ../../target/${{ matrix.target }}/release/bundle/macos/*.app | head -1)"
          echo "bundle: $APP"
          test -x "$APP/Contents/MacOS/diskguardian-app" || { echo "app binary missing"; exit 1; }
          test -x "$APP/Contents/MacOS/diskguardian-admin" || { echo "admin helper missing from Contents/MacOS"; exit 1; }
          ARCH_APP="$(lipo -archs "$APP/Contents/MacOS/diskguardian-app")"
          ARCH_HELPER="$(lipo -archs "$APP/Contents/MacOS/diskguardian-admin")"
          echo "app archs: $ARCH_APP"
          echo "helper archs: $ARCH_HELPER"
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) EXPECT=arm64 ;;
            x86_64-apple-darwin) EXPECT=x86_64 ;;
          esac
          echo "$ARCH_APP" | grep -qw "$EXPECT" || { echo "app is not $EXPECT"; exit 1; }
          echo "$ARCH_HELPER" | grep -qw "$EXPECT" || { echo "helper is not $EXPECT"; exit 1; }
          DMG="$(ls ../../target/${{ matrix.target }}/release/bundle/dmg/*.dmg | head -1)"
          test -s "$DMG" || { echo "no dmg produced"; exit 1; }
          echo "dmg: $DMG"
          # Content identity, not just presence: each shipped binary must be
          # byte-identical to the one cargo built for this triple.
          for bin in diskguardian-app diskguardian-admin; do
            REF="$(sha256sum "../../target/${{ matrix.target }}/release/$bin" | cut -d' ' -f1)"
            PAY="$(sha256sum "$APP/Contents/MacOS/$bin" | cut -d' ' -f1)"
            echo "verify $bin reference sha256: $REF"
            echo "verify $bin in-payload sha256: $PAY"
            [ "$REF" = "$PAY" ] || { echo "$bin inside the bundle is not the binary cargo built"; exit 1; }
          done

      # `shell: bash` on every Windows step: the runner default is pwsh, and the
      # bash idioms below (set -euo pipefail, process substitution) fail in it
      # confusingly rather than usefully.
      - name: Verify the installer contains exactly what Windows ships (app only)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          REF_DIR="../../target/${{ matrix.target }}/release"
          REF="$(sha256sum "$REF_DIR/diskguardian-app.exe" | cut -d' ' -f1)"
          echo "reference diskguardian-app.exe sha256: $REF"
          SETUP="$(ls "$REF_DIR/bundle/nsis/"*-setup.exe | head -1)"
          test -s "$SETUP" || { echo "no nsis setup produced"; exit 1; }
          echo "setup: $SETUP"
          rm -rf payload && mkdir payload
          # 7z extracts the NSIS payload without running the installer. (Fallback if
          # this ever drifts: silent-install to a scratch dir — setup.exe /S /D=... —
          # which is stronger evidence anyway, just slower.)
          7z x -y "$SETUP" -opayload >/dev/null
          # Positive: the app binary cargo built is present by hash, whatever the
          # bundler renamed it to inside the installer.
          FOUND=""
          while IFS= read -r -d '' f; do
            H="$(sha256sum "$f" | cut -d' ' -f1)"
            echo "payload $(basename "$f") sha256: $H"
            if [ -z "$FOUND" ] && [ "$H" = "$REF" ]; then FOUND="$f"; fi
          done < <(find payload -type f -print0)
          test -n "$FOUND" || { echo "the installer payload does not contain the app binary cargo built"; exit 1; }
          echo "app binary present by hash: $FOUND"
          # Negative — the ruling, machine-enforced: no admin helper may appear
          # anywhere in the payload under any casing. A config-merge regression or a
          # stale staged sidecar cannot quietly re-ship the helper (design §3.3).
          NEG="$(find payload -iname 'diskguardian-admin*' | wc -l | tr -d ' ')"
          echo "payload entries matching diskguardian-admin* (case-insensitive): $NEG"
          if [ "$NEG" != "0" ]; then
            find payload -iname 'diskguardian-admin*'
            echo "the Windows payload must ship the app binary ONLY (maintainer ruling, 2026-11-03)"
            exit 1
          fi

      # INSTRUMENTED (Stage A iteration 2, 2026-11-03): the first dispatch failed
      # "diskguardian-app not found by hash in the .deb payload" on a deb that built,
      # extracted, and whose macOS twin passes the identical check. Before anything is
      # changed about the comparison, this step now prints EVERY payload file with size
      # and SHA-256, and — on a miss — `file` plus the rpath/runpath entries of both the
      # reference binary and the same-named payload binary (the patchelf hypothesis:
      # the bundler may rewrite the ELF rpath, making packaged bytes differ from cargo
      # output BY CONSTRUCTION). The hash assertions themselves are unchanged: any miss
      # still fails the step, only after all the evidence has printed.
      - name: Verify the bundles contain what they must (Linux)
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          REF_DIR="../../target/${{ matrix.target }}/release"
          FAIL=0
          declare -A REF
          for bin in diskguardian-app diskguardian-admin; do
            REF[$bin]="$(sha256sum "$REF_DIR/$bin" | cut -d' ' -f1)"
            echo "reference $bin sha256: ${REF[$bin]} size: $(stat -c%s "$REF_DIR/$bin") path: $REF_DIR/$bin"
          done
          # Direct probe for the rpath-rewrite hypothesis: what does each reference
          # binary say about its own rpath/runpath and interpreter?
          if command -v readelf >/dev/null; then
            for bin in diskguardian-app diskguardian-admin; do
              echo "reference $bin readelf dynamic entries:"
              readelf -d "$REF_DIR/$bin" | grep -Ei 'rpath|runpath|interpreter' || echo "  (no rpath/runpath/interpreter entries)"
            done
          else
            echo "readelf unavailable; rpath comparison skipped (install binutils on the runner to include it)"
          fi
          check_dir() {
            local dir="$1" label="$2" bin hit f cand
            echo "── $label: every file, with size and sha256 ──"
            while IFS= read -r -d '' f; do
              echo "$label file: $f size: $(stat -c%s "$f") sha256: $(sha256sum "$f" | cut -d' ' -f1)"
            done < <(find "$dir" -type f -print0)
            for bin in diskguardian-app diskguardian-admin; do
              hit=""
              while IFS= read -r -d '' f; do
                if [ "$(sha256sum "$f" | cut -d' ' -f1)" = "${REF[$bin]}" ]; then hit="$f"; break; fi
              done < <(find "$dir" -type f -print0)
              if [ -n "$hit" ]; then
                echo "$label: $bin present by hash ($hit)"
              else
                echo "MISS: $bin not found by hash in the $label"
                FAIL=1
                # Same-named payload binary vs the reference: sizes, types, and dynamic
                # entries. If patchelf rewrote the ELF, size and rpath tell on it.
                # Exact name first, then a prefix match that cannot be an icon. The
                # previous glob picked diskguardian-app.png out of the deb's share/icons
                # tree and dumped 21,603 lines of cmp noise against it, which is how the
                # R-mutate m1 control died before reaching the AppImage arm.
                # -print -quit instead of `| head -1`: find writing into a closed head is
                # SIGPIPE, and under `set -o pipefail` that aborts the whole step.
                cand="$(find "$dir" -type f -name "$bin" -print -quit)"
                if [ -z "$cand" ]; then
                  cand="$(find "$dir" -type f -name "$bin*" \
                    ! -name '*.png' ! -name '*.ico' ! -name '*.svg' -print -quit)"
                fi
                if [ -n "$cand" ]; then
                  echo "  closest payload candidate: $cand"
                  echo "  payload size: $(stat -c%s "$cand") sha256: $(sha256sum "$cand" | cut -d' ' -f1)"
                  echo "  reference size: $(stat -c%s "$REF_DIR/$bin") sha256: ${REF[$bin]}"
                  file "$cand" || true
                  if command -v readelf >/dev/null; then
                    echo "  payload readelf dynamic entries:"
                    readelf -d "$cand" | grep -Ei 'rpath|runpath|interpreter' || echo "  (no rpath/runpath/interpreter entries)"
                  fi
                  if command -v cmp >/dev/null; then
                    DIFFS="$(cmp -l "$REF_DIR/$bin" "$cand" 2>/dev/null || true)"
                    COUNT="$(printf '%s' "$DIFFS" | grep -c . || true)"
                    echo "  total differing bytes vs reference: ${COUNT:-0}"
                    # Herestrings, not pipes: `printf | head` takes SIGPIPE when head
                    # closes after its lines, and pipefail turns that into exit 141,
                    # killing the step mid-diagnostic. This is what stopped R-mutate m1
                    # from reaching the AppImage arm at all.
                    head -5 <<<"$DIFFS"
                    FIRST="$(head -1 <<<"$DIFFS" | awk '{print $1}')"
                    if [ -n "$FIRST" ] && command -v od >/dev/null; then
                      # Name the exact string the bundler touched: 128 bytes of
                      # context centred on the first differing byte, from both files,
                      # as hex+ASCII.
                      START=$(( FIRST > 64 ? FIRST - 64 : 1 ))
                      echo "  byte context (reference $bin), 128 bytes from offset $START:"
                      dd if="$REF_DIR/$bin" bs=1 skip=$((START - 1)) count=128 2>/dev/null | od -Ad -tx1z
                      echo "  byte context (payload $bin), 128 bytes from offset $START:"
                      dd if="$cand" bs=1 skip=$((START - 1)) count=128 2>/dev/null | od -Ad -tx1z
                    fi
                  fi
                else
                  echo "  no payload file even named like $bin"
                fi
              fi
            done
          }
          # The AppImage arm (design Amendment 2 #3): both binaries are rpath-rewritten
          # by linuxdeploy, so byte-identity is unattainable by construction; the
          # verdict is ELF-content equality — same machine (asserted to be this leg's
          # architecture, since hash equality no longer carries it), same build-id
          # (necessary, not sufficient: it survives post-link mutation), same
          # interpreter, same DT_NEEDED set, RUNPATH exactly $ORIGIN/../lib, same
          # section names, and every section's content hash equal except the
          # bundler-owned .dynstr/.dynamic. NOBITS sections have no file bytes. R-mutate
          # for this arm: one byte flipped in the reference's .text, one in .rodata —
          # both must fail here. Residual blind spot, stated: bytes outside any section
          # are undetectable by any content check.
          # Hash one section's bytes. objcopy is the primary path, but it refuses some
          # sections outright: iteration 5 showed it reject .shstrtab on both binaries
          # with "can't dump section '.shstrtab' - it does not exist: cause of error
          # unknown", though readelf lists the section and its offset is real. Anything
          # objcopy will not dump is read straight out of the file at the offset and
          # size readelf reports, so a section is never skipped by accident — before
          # this fallback existed, .shstrtab silently reused .rodata's bytes and
          # "matched".
          section_hash() { # $1 file, $2 section, $3 scratch path; prints sha256
            local f="$1" sec="$2" out="$3" cols off size got
            rm -f "$out"
            if objcopy --dump-section "$sec=$out" "$f" 2>/dev/null && [ -f "$out" ]; then
              sha256sum "$out" | cut -d' ' -f1
              return 0
            fi
            # objcopy declined (on these binaries it refuses .shstrtab with exit
            # code 0) — read the section's file bytes by readelf's own offset and
            # size. Both are bare HEX: force base 16, because a leading zero makes
            # bash read them as octal — hex letters then abort the arithmetic
            # (loudly), and all-octal-digit values silently address the WRONG
            # window, which would hash the same wrong bytes on both sides.
            cols="$(readelf -SW "$f" \
              | sed -E 's/^ *\[ *[0-9]+\] +//' \
              | awk -v s="$sec" '$1 == s {print $4, $5; exit}')"
            [ -n "$cols" ] || return 1
            off="${cols%% *}"
            size="${cols##* }"
            case "$off$size" in *[!0-9a-fA-F]*) return 1 ;; esac
            rm -f "$out"
            tail -c "+$((16#$off + 1))" "$f" | head -c "$((16#$size))" > "$out"
            # Exact-size assertion, not existence: head creates the file even on a
            # failed read, so only the byte count proves the window was real. A
            # legitimately-empty section reads 0 bytes and hashes as the empty
            # digest — evidence, not a skip.
            got="$(stat -c%s "$out" 2>/dev/null || echo -1)"
            [ "$got" = "$((16#$size))" ] || return 1
            sha256sum "$out" | cut -d' ' -f1
          }

          check_appimage_binary() {
            local ref="$1" payload="$2" label="$3"
            echo "── AppImage ELF-content check: $label ($payload) ──"
            local m_ref m_pay b_ref b_pay i_ref i_pay n_ref n_pay r_pay s_ref s_pay
            m_ref="$(readelf -h "$ref" | sed -n 's/^ *Machine: *//p')"
            m_pay="$(readelf -h "$payload" | sed -n 's/^ *Machine: *//p')"
            echo "machine: reference='$m_ref' payload='$m_pay'"
            { [ -n "$m_ref" ] && [ "$m_ref" = "$m_pay" ]; } || { echo "MISS: machine differs for the $label"; FAIL=1; }
            [ "$m_pay" = "Advanced Micro Devices X86-64" ] || { echo "MISS: the $label is not x86-64 (leg target ${{ matrix.target }})"; FAIL=1; }
            b_ref="$(readelf -n "$ref" | sed -n 's/^ *Build ID: *//p')"
            b_pay="$(readelf -n "$payload" | sed -n 's/^ *Build ID: *//p')"
            echo "build-id: reference=$b_ref payload=$b_pay"
            { [ -n "$b_ref" ] && [ "$b_ref" = "$b_pay" ]; } || { echo "MISS: build-id differs for the $label"; FAIL=1; }
            i_ref="$(readelf -l "$ref" | sed -n 's/.*Requesting program interpreter: //p' | tr -d ']')"
            i_pay="$(readelf -l "$payload" | sed -n 's/.*Requesting program interpreter: //p' | tr -d ']')"
            echo "interpreter: reference='$i_ref' payload='$i_pay'"
            [ "$i_ref" = "$i_pay" ] || { echo "MISS: interpreter differs for the $label"; FAIL=1; }
            n_ref="$(readelf -d "$ref" | sed -n 's/^ *Shared library: *//p' | tr -d '[]"' | sort | tr '\n' ' ')"
            n_pay="$(readelf -d "$payload" | sed -n 's/^ *Shared library: *//p' | tr -d '[]"' | sort | tr '\n' ' ')"
            echo "DT_NEEDED: reference='$n_ref'"
            echo "DT_NEEDED: payload='$n_pay'"
            [ "$n_ref" = "$n_pay" ] || { echo "MISS: DT_NEEDED differs for the $label"; FAIL=1; }
            r_pay="$(readelf -d "$payload" | grep -E 'RPATH|RUNPATH' | sed -E 's/.*\[//; s/\].*//')"
            echo "RUNPATH: payload='$r_pay'"
            [ "$r_pay" = '$ORIGIN/../lib' ] || { echo "MISS: RUNPATH is not \$ORIGIN/../lib for the $label"; FAIL=1; }
            s_ref="$(readelf -SW "$ref" | sed -E 's/^ *\[ *[0-9]+\] +//' | awk '$1 ~ /^\./ {print $1}' | sort | tr '\n' ' ')"
            s_pay="$(readelf -SW "$payload" | sed -E 's/^ *\[ *[0-9]+\] +//' | awk '$1 ~ /^\./ {print $1}' | sort | tr '\n' ' ')"
            echo "sections: reference='$s_ref'"
            echo "sections: payload='$s_pay'"
            [ "$s_ref" = "$s_pay" ] || { echo "MISS: section-name set differs for the $label"; FAIL=1; }
            local sec typ tmpd h_ref h_pay
            tmpd="$(mktemp -d)"
            for sec in $s_ref; do
              case "$sec" in
                .dynstr|.dynamic) echo "section $sec: skipped (bundler-owned, design Amendment 2)"; continue ;;
                # patchelf/linuxdeploy rewrites the section-header string table on the
                # AppImage: reference ceb97862… and payload 6b8f3b8d…, byte-identical
                # across BOTH binaries in run 41645973726, and the reference value
                # reproduced from a fresh local dump. The table's semantics are still
                # verified, because the section-NAME SET is asserted equal separately
                # above: a renamed, added or dropped section changes that set and fails
                # before this line is reached. What differs is the bundler's byte
                # arrangement of the names, not which sections exist or what is in them.
                .shstrtab) echo "section $sec: skipped (bundler-owned string table; the name-set assertion carries the semantics)"; continue ;;
              esac
              typ="$(readelf -SW "$ref" | sed -E 's/^ *\[ *[0-9]+\] +//' | awk -v s="$sec" '$1 == s {print $2; exit}')"
              if [ "$typ" = "NOBITS" ]; then echo "section $sec: skipped (NOBITS — no file bytes to hash)"; continue; fi
              # section_hash removes its output before extracting and only accepts a
              # hash when the file exists afterwards, so a dump that exits 0 while
              # writing nothing can never be mistaken for the previous section's
              # bytes. Iteration 4 printed .rodata and .shstrtab with identical
              # reference hashes (0e40f15e… on the app, 53572043… on the admin) —
              # real section content cannot do that, and it was objcopy declining
              # .shstrtab while the stale .rodata dump was re-hashed.
              h_ref="$(section_hash "$ref" "$sec" "$tmpd/ref.bin")" || h_ref=""
              h_pay="$(section_hash "$payload" "$sec" "$tmpd/pay.bin")" || h_pay=""
              if [ -z "$h_ref" ] || [ -z "$h_pay" ]; then
                echo "MISS: cannot extract section $sec for comparison ($label)"
                FAIL=1
                continue
              fi
              echo "section $sec sha256: reference=$h_ref payload=$h_pay"
              [ "$h_ref" = "$h_pay" ] || { echo "MISS: section $sec differs for the $label"; FAIL=1; }
            done
            rm -rf "$tmpd"
          }
          DEB="$(ls "$REF_DIR/bundle/deb/"*.deb | head -1)"
          if [ -s "$DEB" ]; then
            echo "deb: $DEB"
            # Asset-level hash for Stage B, which runs on macOS and cannot
            # dpkg-deb -x: this printed line is what its download re-hash
            # compares against (design Amendment 2 #5).
            echo "asset sha256 (.deb): $(sha256sum "$DEB" | cut -d' ' -f1)"
            rm -rf debx && mkdir debx
            if dpkg-deb -x "$DEB" debx; then
              # Unchanged by Amendment 2: with --no-binary-patching the deb's
              # binaries are the cargo build products, so plain hash equality
              # is the check.
              check_dir debx ".deb payload"
            else
              echo "MISS: dpkg-deb -x failed on $DEB"
              FAIL=1
            fi
          else
            echo "MISS: no deb produced"
            FAIL=1
          fi
          APPIMG="$(ls "$REF_DIR/bundle/appimage/"*.AppImage | head -1)"
          if [ -s "$APPIMG" ]; then
            echo "appimage: $APPIMG"
            echo "asset sha256 (.AppImage): $(sha256sum "$APPIMG" | cut -d' ' -f1)"
            APPIMG_ABS="$(cd "$(dirname "$APPIMG")" && pwd)/$(basename "$APPIMG")"
            rm -rf appx && mkdir appx
            # Type-2 extraction needs no FUSE.
            if (cd appx && "$APPIMG_ABS" --appimage-extract >/dev/null); then
              # The enumeration stays (Amendment 2 #7 — it is the evidence trail);
              # the verdicts are the section-wise checks, because linuxdeploy
              # rewrites BOTH binaries here.
              echo "── AppImage payload: every file, with size and sha256 ──"
              while IFS= read -r -d '' f; do
                echo "AppImage payload file: $f size: $(stat -c%s "$f") sha256: $(sha256sum "$f" | cut -d' ' -f1)"
              done < <(find appx/squashfs-root -type f -print0)
              check_appimage_binary "$REF_DIR/diskguardian-app" "appx/squashfs-root/usr/bin/diskguardian-app" "app binary"
              check_appimage_binary "$REF_DIR/diskguardian-admin" "appx/squashfs-root/usr/bin/diskguardian-admin" "admin sidecar"
            else
              echo "MISS: --appimage-extract failed on $APPIMG"
              FAIL=1
            fi
          else
            echo "MISS: no AppImage produced"
            FAIL=1
          fi
          exit "$FAIL"

      - uses: actions/upload-artifact@v7
        with:
          name: diskguardian-${{ matrix.target }}
          # Every glob is triple-prefixed, so a leg can only ever match its own
          # products; `if-no-files-found: error` then makes a leg that produced none of
          # its bundles fail the upload rather than ship a hole.
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/macos/*.app
            target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  release:
    name: Attach to the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect the bundles
        run: |
          set -euo pipefail
          mkdir -p out
          # `find`, not a `**` glob: shell globstar is off by default and a silent
          # no-match here would upload nothing and still succeed.
          find artifacts -name '*.dmg' -type f -exec cp {} out/ \;
          # The architecture comes from the artifact directory (diskguardian-<triple>),
          # NOT from the immediate parent: upload-artifact preserves the workspace path, so
          # the parent is always "macos" and both architectures wrote the same filename —
          # the second silently overwrote the first, shipping one arch's app zip as both.
          find artifacts -name '*.app' -type d -prune | while read -r app; do
            name="$(basename "$app" .app)"
            suffix="$(echo "$app" | sed -E 's#^artifacts/diskguardian-##; s#/.*##')"
            if [ -z "$suffix" ] || [ "$suffix" = "$app" ]; then
              echo "cannot derive an architecture from $app"; exit 1
            fi
            ditto -c -k --sequesterRsrc --keepParent "$app" "out/${name}-${suffix}.zip"
          done
          # The single-file bundles from the new legs, renamed by the same triple rule
          # (design §3.5): the bundler's own names embed short arch names and versions,
          # which is how collisions happen.
          find artifacts -name '*-setup.exe' -type f | while read -r exe; do
            suffix="$(echo "$exe" | sed -E 's#^artifacts/diskguardian-##; s#/.*##')"
            cp "$exe" "out/DiskGuardian-${suffix}-setup.exe"
          done
          for pat in '*.deb' '*.AppImage'; do
            find artifacts -name "$pat" -type f | while read -r f; do
              suffix="$(echo "$f" | sed -E 's#^artifacts/diskguardian-##; s#/.*##')"
              ext="${f##*.}"
              cp "$f" "out/DiskGuardian-${suffix}.${ext}"
            done
          done
          # The exact matrix-derived asset count (design §3.5): 4 targets ->
          # 2 dmg + 2 triple-suffixed zip + 1 setup.exe + 1 deb + 1 AppImage.
          # Change this number when the matrix changes.
          EXPECTED=7
          count=$(ls -1 out | wc -l | tr -d ' ')
          echo "collected $count artifact(s), expected exactly $EXPECTED:"
          ls -la out
          [ "$count" -eq "$EXPECTED" ] || { echo "expected exactly $EXPECTED assets"; exit 1; }
          dups="$(ls out | sort | uniq -d)"
          [ -z "$dups" ] || { echo "duplicate asset names: $dups"; exit 1; }
          # Design §7 B2, now executable rather than carried by a human reading
          # ls -la: every asset must be at least 1,000,000 bytes (the pre-committed
          # floor, 3x under the smallest known-good v0.1.0 asset at 2.96 MB).
          while IFS= read -r -d '' f; do
            size="$(stat -f%z "$f")"
            echo "asset $f size: $size"
            [ "$size" -ge 1000000 ] || { echo "asset is below the 1,000,000-byte floor"; exit 1; }
          done < <(find out -type f -print0)

      - name: Create the release and publish it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          # Per-platform blocks (design §3.6): each platform is told what its OS will
          # actually warn about, including the Windows self-elevation behaviour new in
          # 0.1.1 and the Linux not-yet for restricted-area measurement.
          NOTES: |
            ## macOS

            Unsigned build: there is no signing identity for this project, so macOS will
            quarantine the download. After moving DiskGuardian to Applications, either
            right-click it and choose Open, or run:

                xattr -dr com.apple.quarantine /Applications/DiskGuardian.app

            The administrator measurement helper ships inside the app bundle and is only
            ever started by the app, behind the system's own consent dialog. It measures;
            it never deletes.

            ## Windows

            Unsigned build: SmartScreen will show "Windows protected your PC". Choose
            *More info*, then *Run anyway*.

            Measuring restricted areas asks Windows for administrator rights (one UAC
            prompt per app session) — the app re-launches itself elevated to measure,
            and the elevated copy only measures; it never deletes. Decline it and
            everything else works, with those areas shown as restricted. This behaviour
            is new in 0.1.1.

            ## Linux

            The .deb is unsigned: install it with
            `sudo apt install ./DiskGuardian-x86_64-unknown-linux-gnu.deb` or
            `sudo dpkg -i`. The AppImage needs FUSE, which some distributions omit;
            `--appimage-extract-and-run` is the no-FUSE route.

            Measuring restricted areas is not available on Linux yet; those areas stay
            shown as restricted.
        run: |
          set -euo pipefail
          # --repo on every call: this job never checks out, so gh has no git context to
          # infer the repository from. Without it gh fails with "not a git repository"
          # after the artifacts were already collected.
          #
          # The tag IS the release: there is no manual publish step afterwards and no
          # draft left behind. The asset set was verified above before this runs, and it
          # is verified again below against what GitHub actually holds, so a partial
          # upload fails this job rather than publishing a hole. A draft was the wrong
          # default: it silently left "Latest" on the oldest release while every version
          # surface on disk already read the new one.
          REPO="${{ github.repository }}"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --repo "$REPO" --clobber
            gh release edit "$TAG" --repo "$REPO" --draft=false
          else
            gh release create "$TAG" out/* --repo "$REPO" \
              --title "DiskGuardian $TAG" --notes "$NOTES"
          fi

          # Prove it from the API, not from the staging directory: what `out/` holds is
          # not evidence about what the release page serves.
          EXPECTED=7
          assets="$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets | length')"
          echo "release holds $assets asset(s), expected exactly $EXPECTED"
          [ "$assets" -eq "$EXPECTED" ] || { echo "published asset count mismatch"; exit 1; }

          small="$(gh release view "$TAG" --repo "$REPO" --json assets \
            --jq '[.assets[] | select(.size < 1000000)] | length')"
          echo "assets below the 1,000,000-byte floor: $small"
          [ "$small" -eq 0 ] || { echo "a published asset is below the floor"; exit 1; }

          draft="$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq '.isDraft')"
          echo "draft: $draft"
          [ "$draft" = "false" ] || { echo "the release is still a draft"; exit 1; }
