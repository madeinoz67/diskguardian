<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DiskGuardian</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <nav id="crumbs" aria-label="Location"></nav>
        <div id="status"></div>
        <button id="admin-action" type="button" class="crumb action" hidden>
          Measure restricted areas…
        </button>
      </header>
      <div id="toast" hidden><span id="toast-text"></span><button id="toast-close" type="button">Dismiss</button></div>

      <main id="content">
        <section id="stage">
          <canvas id="sunburst"></canvas>
          <div id="hover-label" hidden></div>
          <div id="empty-state" hidden>
            <p>Drop a disk or folder here, or press Scan.</p>
          </div>
        </section>
        <aside id="legend" aria-label="Contents"></aside>
      </main>

      <div id="cleanup" hidden>
        <header class="cleanup-head">
          <h1>Cleanup</h1>
          <div class="cleanup-controls">
            <label>at least
              <select id="cleanup-floor">
                <option value="104857600">100 MB</option>
                <option value="536870912">500 MB</option>
                <option value="1073741824" selected>1 GB</option>
                <option value="10737418240">10 GB</option>
              </select>
            </label>
            <label>age
              <select id="cleanup-age">
                <option value="">any</option>
                <option value="30:old">older than 30 days</option>
                <option value="90:old">older than 90 days</option>
                <option value="7:new">changed in the last 7 days</option>
                <option value="1:new">changed in the last day</option>
              </select>
            </label>
            <button id="cleanup-run" type="button">Refresh</button>
            <button id="cleanup-close" type="button">Close</button>
          </div>
        </header>
        <div class="cleanup-body">
          <section>
            <h2 id="candidates-title">Candidates</h2>
            <div id="candidates-list" class="cleanup-list"></div>
          </section>
          <section>
            <h2 id="biggest-title">Biggest items</h2>
            <div id="biggest-list" class="cleanup-list"></div>
          </section>
        </div>
      </div>

      <div id="overview" hidden>
        <div class="overview-inner">
          <h1>Disks and folders</h1>
          <div id="volume-list"></div>
          <div class="overview-footer">
            <button id="scan-folder" type="button">Scan Folder…</button>
            <span class="hint">or drop a disk or folder anywhere in this window</span>
          </div>
          <form id="manual-path-form" class="manual-path" autocomplete="off">
            <input
              id="manual-path"
              type="text"
              placeholder="…or type a path, e.g. /tmp or ~/Documents"
              spellcheck="false"
              autocapitalize="off"
              aria-label="Path to scan"
            />
            <button id="manual-scan" type="submit">Scan path</button>
          </form>
        </div>
      </div>

      <footer id="collector">
        <div id="collect-dial"><span id="collect-value">0</span></div>
        <div id="collect-text">
          <strong id="collect-amount">0 bytes</strong>
          <span id="collect-caption">in the collector</span>
        </div>
        <button id="cleanup-open" type="button" class="collector-action">Candidates</button>
        <button id="delete-button" type="button" disabled>Delete</button>
      </footer>
    </div>
  </body>
</html>
