<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DiskGuardian</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <nav id="crumbs" aria-label="Location"></nav>
        <div id="status"></div>
        <button id="admin-action" type="button" class="crumb action" hidden>
          Measure restricted areas…
        </button>
      </header>
      <div id="toast" hidden><span id="toast-text"></span><button id="toast-close" type="button">Dismiss</button></div>

      <main id="content">
        <section id="stage">
          <canvas id="sunburst"></canvas>
          <div id="hover-label" hidden></div>
          <div id="empty-state" hidden>
            <p>Drop a disk or folder here, or press Scan.</p>
          </div>
        </section>
        <aside id="legend" aria-label="Contents"></aside>
      </main>

      <div id="overview" hidden>
        <div class="overview-inner">
          <h1>Disks and folders</h1>
          <div id="volume-list"></div>
          <div class="overview-footer">
            <button id="scan-folder" type="button">Scan Folder…</button>
            <span class="hint">or drop a disk or folder anywhere in this window</span>
          </div>
        </div>
      </div>

      <footer id="collector">
        <div id="collect-dial"><span id="collect-value">0</span></div>
        <div id="collect-text">
          <strong id="collect-amount">0 bytes</strong>
          <span id="collect-caption">in the collector</span>
        </div>
        <button id="delete-button" type="button" disabled>Delete</button>
      </footer>
    </div>
  </body>
</html>
